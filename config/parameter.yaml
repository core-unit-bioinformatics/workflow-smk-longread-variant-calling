# === DOCS
# For the time being, ignore these settings.
# NB: the 'reference_container_store' variable should
# typically be set in some environment-specific
# configuration file (YAML)
# ===
# use_reference_container: False
# reference_container_store: "."
# reference_container_names:
#   - test_v1

# === DOCS
# this path can point to a resource such as a directory
# on the local file system or some remote location that
# enables Snakemake to find the Singularity/Apptainer
# containers used in this workflow. If not specified,
# this is set to the Snakemake working directory.
# NB: the 'container_store' variable should typically
# be set in some environment-specific configuration file (YAML)
# ===
# container_store: "."


# Set in project-specific
# config - which reference
# genomes should be used.
# reference_genomes:
#   label: fasta_file_name
reference_genomes:
  hg38: mock_hg38.fa

# if the sample sheet does not list paths to
# individual files per sample, specify which
# file extension to collect from directories
input_file_ext:
  - fastq.gz
  - fasta.gz
  - fq.gz
  - fa.gz
  - fna.gz

# valid calling modes:
# 1. population: jointly process samples but ignore potential kinship information
# 2. trio: as above plus run DeepTrio for family samples (at least duos)
variant_calling_mode: trio

######################################
### GENERAL ALIGNER RUNTIME PARAMETERS
######################################

# if applicable, set for all aligners ...
# Ratio of primary to secondary alignment,
# discard if below that threshold.
# minimap2 default is 0.8
min_ratio_prime_to_second: 0.9
keep_at_most_n_second: 5

# SAM flags to (i) filter alignments
# while they are being generated and
# (ii) after everything has been merged.
sam_flag_discard: 1540
sam_flag_split: 256

run_hifi_aligner:
  - minimap2

run_ont_aligner:
  - minimap2

run_hifi_sv_toolchain:
  - minimap2, sniffles

# TODO
# this needs a workaround for the noise annotation files
run_hifi_cnv_toolchain:
  - minimap2, hificnv

# see note about variant calling mode;
# DeepTrio will be used in case of mode 'trio'
run_hifi_short_toolchain:
  - minimap2, DeepVariant

####################################
### GENERAL TOOL RUNTIME PARAMETERS
####################################

### PARAMETERS FOR BASIC QC /
### READ DEPTH COMPUTATION WITH MOSDEPTH

# mosdepth window size and quantize_*
# option apply to the whole-genome
# setting
mosdepth_window_size: 10000
# MUST BE LISTS
mosdepth_quantize_steps: [0, 1, 5, 10, 15]
mosdepth_quantize_names:
  - NO_COV
  - LOW_COV
  - CALLABLE
  - GOOD_COV
  - HIGH_COV

# mosdepth coverage thresholds
# apply to user-supplied regions
# of interest (QC regions) that
# are expected to exhibit good
# coverage
# MUST BE A LIST
mosdepth_cov_thresholds: [0, 1, 5, 10, 15]

# NB: this should be set to the
# same value as for the long
# variant calling (default: 20).
# Adding 0 to the list enables
# checking if a call could be
# made at a lower MAPQ
# MUST BE A LIST
mosdepth_min_mapq: [0, 20]


### PARAMETERS FOR SHORT VARIANT CALLING

# only v1.5.0+ supports low-error
# ONT reads (>= R10.4)
# latest test with DeepVariant v1.10.0
# > replace mock container name w/ actual name
deepvariant: mock_deepvariant_v1.10.0_container.cont
deepvariant_models:
  hifi: PACBIO
  ont: ONT_R104

# latest test with DeepVariant/DeepTrio v1.10.0
# NB: the model name for ONT reads in DeepTrio
# is just 'ONT' and not 'ONT_R104' (see above)
# > replace mock container name w/ actual name
deeptrio: mock_deeptrio_v1.10.0_container.cont
deeptrio_models:
  hifi: PACBIO
  ont: ONT

# > replace mock container name w/ actual name
glnexus: mock_glnexus_v1.4.1_container.cont
glnexus_preset: deepvariant_unfiltered

# This is used to split the potentially
# large short variant callsets
# (w/o any other filtering)
# by variant type
# (bcftools 'view --types' option)
split_short_calls:
  snv: snps
  indel: indels
  other: mnps,ref,bnd,other

### PARAMETERS FOR LONG VARIANT CALLING

# SVs are defined as variants
# of at least 50 bp.
# This parameter is set below
# that threshold to produce some
# overlap with the short variant
# callers (in bp)
minimum_sv_length_call: 50

# ignore alignments with MAPQ
# below this threshold
minimum_mapq: 20

# ignore regions/candidates with read
# coverage/support below this threshold
# (interpretation is tool-specific)
minimum_coverage: 5

# ignore reads/alignments with an alignment
# length below this threshold (in bp)
minimum_alignment_length: 1000
