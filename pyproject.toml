[cubi.workflow]
pid = "https://github.com/core-unit-bioinformatics/workflow-smk-longread-variant-calling"
name = "longread-variant-calling"
version = "prototype"

[cubi.metadata]
pid = "https://github.com/core-unit-bioinformatics/template-metadata-files"
version = "1.6.1"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[cubi.workflow.template]
pid = "https://github.com/core-unit-bioinformatics/template-snakemake"
system = "smk"
version = "1.6.0"

[tool.pylint.format]
max-line-length = "88"

[tool.pylint.messages_control]
disable = [ "logging-fstring-interpolation", "useless-return", "missing-module-docstring",]
